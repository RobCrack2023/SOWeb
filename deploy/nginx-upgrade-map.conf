# Necesario para que el proxy del WebSocket funcione.
#
# `$connection_upgrade` vale "upgrade" solo cuando el cliente pidió cambiar de
# protocolo, y "close" en las peticiones HTTP normales. Sin este map, nginx
# mandaría "Connection: upgrade" en todo y el resto de la API se rompería.
#
# Instalación (va en el contexto http, no dentro del server):
#   sudo cp deploy/nginx-upgrade-map.conf /etc/nginx/conf.d/soweb-upgrade.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
