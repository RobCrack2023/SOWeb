# SOWeb — nginx en el VPS.
#
# Sirve el frontend compilado y hace de proxy al backend bajo /api, de modo
# que todo vive en un mismo origen: sin CORS, y el WebSocket viaja como wss://
# por la misma conexión TLS.
#
# Instalación:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/soweb
#   sudo ln -s /etc/nginx/sites-available/soweb /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El certificado lo agrega certbot:
#   sudo certbot --nginx -d soweb.tu-dominio.cl
# (certbot reescribe este archivo para añadir el bloque 443 y la redirección).

server {
    listen 80;
    listen [::]:80;
    server_name soweb.tu-dominio.cl;

    # Los archivos que sube la gente pueden ser grandes; el default de nginx
    # es 1 MB y rechazaría una subida normal con un 413.
    client_max_body_size 100M;

    root /var/www/soweb;
    index index.html;

    access_log /var/log/nginx/soweb.access.log;
    error_log  /var/log/nginx/soweb.error.log;

    # El frontend es una SPA: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre, así que se pueden cachear para
    # siempre. index.html no, o quedaría pegado a una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx 1.18 no tiene la extensión .mjs en su tabla de tipos, así que la
    # serviría como application/octet-stream y el navegador rechazaría el
    # módulo: un ES module solo se carga con un MIME de JavaScript. El worker
    # de pdf.js es un .mjs, y sin esto pdfSO no abre ningún documento.
    # Va en un location aparte porque una expresión regular gana sobre el
    # prefijo /assets/, de modo que el cacheo hay que repetirlo acá.
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        # Estas dos son las que permiten el WebSocket de waSO.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMAP y SMTP pueden tardar; el default de 60s cortaría una descarga
        # de correo a mitad de camino.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
